[package]
name = "novasentry"
version = "0.1.0"
edition = "2021"
authors = [
    "rifkyakhmadx911@gmail.com (Core Implementer)",
    "seafaruzan@gmail.com (Component Engineer)"
]
description = "NovaSentry: Autonomous Multi-Agent AI RAG Guardrail and Intelligence System in Rust"
license = "MIT OR Apache-2.0"

[dependencies]
# Async Runtime
tokio = { version = "1.38", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
async-trait = "0.1.80"

# Serialization & Data
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
uuid = { version = "1.8.0", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }

# Error Handling
thiserror = "1.0.61"

# Web Server & REST API
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Authentication & Database
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
dotenvy = "0.15"

# Logging & Telemetry
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[dev-dependencies]
tokio-test = "0.4.4"
