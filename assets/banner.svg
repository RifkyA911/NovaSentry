<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="modernBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="50%" stop-color="#101524" />
      <stop offset="100%" stop-color="#080a10" />
    </linearGradient>

    <!-- Fluid Sunset Carrot Gradient -->
    <linearGradient id="carrotSunset" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="30%" stop-color="#fdba74" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Fluid Logo Gradients -->
    <linearGradient id="bannerLogoFluid" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffa034" />
      <stop offset="40%" stop-color="#ff6b00" />
      <stop offset="80%" stop-color="#f04e00" />
      <stop offset="100%" stop-color="#c43000" />
    </linearGradient>

    <linearGradient id="bannerLogoSoft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#fb923c" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffedd5" stop-opacity="1" />
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="dotMatrix" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#f97316" opacity="0.12" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="320" rx="20" fill="url(#modernBg)" />
  <rect width="1000" height="320" rx="20" fill="url(#dotMatrix)" />

  <!-- Ambient Organic Light Orbs -->
  <circle cx="170" cy="160" r="140" fill="#f97316" opacity="0.16" filter="url(#softGlow)" />
  <circle cx="880" cy="80" r="120" fill="#ea580c" opacity="0.10" filter="url(#softGlow)" />
  <ellipse cx="500" cy="300" rx="280" ry="80" fill="#fb923c" opacity="0.06" filter="url(#softGlow)" />

  <!-- Outer Glass Border -->
  <rect x="1.5" y="1.5" width="997" height="317" rx="18.5" fill="none" stroke="#f97316" stroke-width="1.2" stroke-opacity="0.25" />

  <!-- =============================== -->
  <!-- LEFT: SOFT 3D LOGO ARTWORK      -->
  <!-- =============================== -->
  <g transform="translate(68, 40)">
    <!-- Base Soft 3D Shield Body -->
    <path d="M 115 15
             C 160 15 200 42 200 105
             C 200 158 152 198 115 214
             C 78 198 30 158 30 105
             C 30 42 70 15 115 15 Z"
          fill="url(#bannerLogoFluid)"
          filter="url(#softGlow)" />

    <!-- Soft 3D Glaze Highlight -->
    <path d="M 115 18
             C 155 18 190 42 192 98
             C 180 50 150 26 115 26
             C 80 26 50 50 38 98
             C 40 42 75 18 115 18 Z"
          fill="#ffffff"
          opacity="0.3" />

    <!-- Recessed Inner Cavity -->
    <path d="M 115 38
             C 150 38 180 60 180 108
             C 180 150 144 182 115 195
             C 86 182 50 150 50 108
             C 50 60 80 38 115 38 Z"
          fill="#0c101d"
          stroke="#ff7714"
          stroke-opacity="0.4"
          stroke-width="2" />

    <!-- Floating 3D Core Sphere -->
    <circle cx="115" cy="112" r="32" fill="url(#bannerLogoFluid)" filter="url(#softGlow)" />
    <!-- Orb Specular Highlight -->
    <ellipse cx="110" cy="98" rx="16" ry="9" fill="#ffffff" opacity="0.45" transform="rotate(-15 110 98)" />
    <circle cx="104" cy="94" r="3.5" fill="#ffffff" opacity="0.9" />

    <!-- 3D Orbit Torus Ring -->
    <ellipse cx="115" cy="114" rx="50" ry="19"
             fill="none"
             stroke="url(#bannerLogoSoft)"
             stroke-width="4"
             stroke-linecap="round"
             transform="rotate(-24 115 114)"
             filter="url(#softGlow)" />

    <!-- Eye Pupil Center -->
    <circle cx="115" cy="112" r="11" fill="#07090f" stroke="#ffaa5e" stroke-width="1.5" />
    <circle cx="115" cy="112" r="5" fill="#ff7300" />
    <circle cx="115" cy="112" r="2" fill="#ffffff" />
  </g>

  <!-- =============================== -->
  <!-- RIGHT: MODERN HERO CONTENT      -->
  <!-- =============================== -->
  <g transform="translate(305, 58)">
    <!-- Top Pill: Status -->
    <g transform="translate(0, 0)">
      <rect width="215" height="26" rx="13" fill="rgba(249, 115, 22, 0.12)" stroke="#f97316" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="14" cy="13" r="4" fill="#f97316" />
      <text x="26" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fb923c">
        AUTONOMOUS AI SENTRY
      </text>
      <rect x="175" y="5" width="34" height="16" rx="8" fill="#f97316" />
      <text x="192" y="16" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">v0.1</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="65" font-family="'Inter', -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="url(#carrotSunset)">
      NOVASENTRY
    </text>

    <!-- Plain-Language Value Proposition -->
    <text x="0" y="100" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">
      Satpam Cerdas (AI Security Guard) untuk Aplikasi LLM &amp; Server
    </text>

    <!-- Short Layman Description -->
    <text x="0" y="125" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      Mencegat serangan manipulasi prompt injeksi, mengamankan data sensitif, dan
    </text>
    <text x="0" y="145" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      menghasilkan solusi mitigasi otomatis berlandaskan buku pedoman resmi (SOP/CVE).
    </text>

    <!-- Pills Grid: Tech & Features -->
    <g transform="translate(0, 172)">
      <!-- Pill 1: Rust Core -->
      <rect x="0" y="0" width="105" height="28" rx="8" fill="#131722" stroke="rgba(249, 115, 22, 0.3)" stroke-width="1" />
      <text x="52" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#fb923c" text-anchor="middle">🦀 Pure Rust</text>

      <!-- Pill 2: SQLite Auth -->
      <rect x="115" y="0" width="130" height="28" rx="8" fill="#131722" stroke="rgba(249, 115, 22, 0.3)" stroke-width="1" />
      <text x="180" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#fb923c" text-anchor="middle">🔒 SQLite Auth</text>

      <!-- Pill 3: Dual Guardrail -->
      <rect x="255" y="0" width="140" height="28" rx="8" fill="#131722" stroke="rgba(249, 115, 22, 0.3)" stroke-width="1" />
      <text x="325" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#fb923c" text-anchor="middle">🛡️ Dual Guardrail</text>

      <!-- Pill 4: n8n Flow Graph -->
      <rect x="405" y="0" width="155" height="28" rx="8" fill="#131722" stroke="rgba(249, 115, 22, 0.3)" stroke-width="1" />
      <text x="482" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#fb923c" text-anchor="middle">🎛️ n8n-Style Flow</text>
    </g>
  </g>
</svg>
