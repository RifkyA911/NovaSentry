<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="modernBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0f1422" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- 3D Carrot Sunset Gradient -->
    <linearGradient id="carrotSunset" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="30%" stop-color="#fdba74" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- 3D Logo Gradients -->
    <linearGradient id="b3d-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd4a3" />
      <stop offset="35%" stop-color="#ff7a1a" />
      <stop offset="75%" stop-color="#d9480f" />
      <stop offset="100%" stop-color="#541c0a" />
    </linearGradient>

    <radialGradient id="b3d-face" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff9d42" />
      <stop offset="25%" stop-color="#ff6a00" />
      <stop offset="65%" stop-color="#c23900" />
      <stop offset="100%" stop-color="#691a00" />
    </radialGradient>

    <radialGradient id="b3d-sphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#ffe2b8" />
      <stop offset="45%" stop-color="#ff7e14" />
      <stop offset="80%" stop-color="#b83200" />
      <stop offset="100%" stop-color="#450d00" />
    </radialGradient>

    <linearGradient id="b3d-torus-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#ffd5a3" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#ff6600" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#b43403" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="b3d-torus-back" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3d1306" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#782405" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.5" />
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="b3d-shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#ea580c" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <pattern id="dotMatrix" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#f97316" opacity="0.14" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="320" rx="20" fill="url(#modernBg)" />
  <rect width="1000" height="320" rx="20" fill="url(#dotMatrix)" />

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="160" r="130" fill="#f97316" opacity="0.18" filter="url(#softGlow)" />
  <circle cx="880" cy="80" r="120" fill="#ea580c" opacity="0.10" filter="url(#softGlow)" />
  <ellipse cx="500" cy="300" rx="280" ry="80" fill="#fb923c" opacity="0.06" filter="url(#softGlow)" />

  <!-- Glass Border -->
  <rect x="1.5" y="1.5" width="997" height="317" rx="18.5" fill="none" stroke="#f97316" stroke-width="1.2" stroke-opacity="0.25" />

  <!-- =============================== -->
  <!-- LEFT: SOFT-BODY 3D BALL ARTWORK -->
  <!-- =============================== -->
  <g transform="translate(68, 30) scale(0.46)">
    <!-- Floor Shadow -->
    <ellipse cx="256" cy="442" rx="150" ry="26" fill="#140300" opacity="0.6" filter="url(#softGlow)" />

    <!-- Rear Loop -->
    <path d="M 172 178 C 134 118 200 62 284 76 C 362 88 412 168 376 254 C 346 326 264 362 208 328 C 168 304 184 246 226 232 C 278 214 316 168 288 126 C 264 92 204 104 172 178 Z"
          fill="url(#b3d-face)" />

    <!-- Lower Bulb -->
    <path d="M 148 248 C 112 288 116 358 172 404 C 230 452 334 446 384 388 C 432 332 408 262 344 246 C 284 232 232 278 198 274 C 174 270 160 258 148 248 Z"
          fill="url(#b3d-rim)" />

    <!-- Main Central Soft-Body Sphere -->
    <path d="M 216 104 C 310 72 418 132 416 238 C 414 334 322 404 224 388 C 134 374 88 278 112 188 C 130 122 172 118 216 104 Z"
          fill="url(#b3d-sphere)" filter="url(#softGlow)" />

    <!-- Top Cushion Crest -->
    <path d="M 184 108 C 236 82 322 96 356 156 C 386 210 354 272 296 286 C 238 300 184 256 166 204 C 152 162 158 122 184 108 Z"
          fill="url(#b3d-face)" />

    <!-- Center Iris Eye -->
    <circle cx="260" cy="230" r="28" fill="#140400" />
    <circle cx="260" cy="230" r="14" fill="#ff7a1a" filter="url(#softGlow)" />
    <circle cx="260" cy="230" r="6" fill="#ffffff" />

    <!-- Glossy Specular Arc -->
    <ellipse cx="218" cy="134" rx="28" ry="14" fill="#ffffff" opacity="0.9" transform="rotate(-25 218 134)" />
    <circle cx="236" cy="126" r="6" fill="#ffffff" opacity="0.95" />
  </g>

  <!-- =============================== -->
  <!-- RIGHT: MODERN HERO CONTENT (EN) -->
  <!-- =============================== -->
  <g transform="translate(305, 54)">
    <!-- Top Pill: Status -->
    <g transform="translate(0, 0)">
      <rect width="248" height="26" rx="13" fill="rgba(249, 115, 22, 0.12)" stroke="#f97316" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="14" cy="13" r="4" fill="#f97316" />
      <text x="26" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fb923c">
        AUTONOMOUS AI SENTRY
      </text>
      <rect x="206" y="5" width="34" height="16" rx="8" fill="#f97316" />
      <text x="223" y="16" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">v0.1</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="65" font-family="'Inter', -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="url(#carrotSunset)">
      NOVASENTRY
    </text>

    <!-- Value Proposition (English) -->
    <text x="0" y="100" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">
      Autonomous AI RAG Security Sentry &amp; Perimeter Guardrail System
    </text>

    <!-- Enterprise Description (English) -->
    <text x="0" y="125" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      Intercepts adversarial prompt injections, prevents secret exfiltration, and synthesizes
    </text>
    <text x="0" y="145" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      context-grounded incident mitigations against verified organization playbooks.
    </text>

    <!-- Badges Grid: Tech & Features -->
    <g transform="translate(0, 172)">
      <!-- Badge 1: Rust Core -->
      <rect x="0" y="0" width="110" height="28" rx="8" fill="#131722" stroke="rgba(249, 115, 22, 0.3)" stroke-width="1" />
      <text x="55" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#fb923c" text-anchor="middle">🦀 Pure Rust</text>

      <!-- Badge 2: SQLite Auth -->
      <rect x="120" y="0" width="130" height="28" rx="8" fill="#131722" stroke="rgba(249, 115, 22, 0.3)" stroke-width="1" />
      <text x="185" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#fb923c" text-anchor="middle">🔒 SQLite Auth</text>

      <!-- Badge 3: Dual Guardrail -->
      <rect x="260" y="0" width="145" height="28" rx="8" fill="#131722" stroke="rgba(249, 115, 22, 0.3)" stroke-width="1" />
      <text x="332" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#fb923c" text-anchor="middle">🛡️ Dual Guardrail</text>

      <!-- Badge 4: n8n Flow Graph -->
      <rect x="415" y="0" width="160" height="28" rx="8" fill="#131722" stroke="rgba(249, 115, 22, 0.3)" stroke-width="1" />
      <text x="495" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#fb923c" text-anchor="middle">🎛️ n8n-Style Flow</text>
    </g>
  </g>
</svg>
