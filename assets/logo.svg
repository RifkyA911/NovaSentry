<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Ambient 3D Shadow -->
    <filter id="shield3d-shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#ea580c" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Orb 3D Shadow -->
    <filter id="orb3d-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#431407" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Core Bloom / Glow -->
    <filter id="core3d-bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 3D Outer Shield Rim Gradient (Top-Left Key Light) -->
    <linearGradient id="shield3d-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd4a3" />
      <stop offset="30%" stop-color="#ff7a1a" />
      <stop offset="70%" stop-color="#d9480f" />
      <stop offset="100%" stop-color="#541c0a" />
    </linearGradient>

    <!-- 3D Bevel Top Left Light -->
    <linearGradient id="shield3d-bevel-light" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff9944" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </linearGradient>

    <!-- 3D Bevel Right Shadow -->
    <linearGradient id="shield3d-bevel-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0800" stop-opacity="0" />
      <stop offset="60%" stop-color="#451205" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1a0400" stop-opacity="0.9" />
    </linearGradient>

    <!-- Shield Face Plate Gradient -->
    <radialGradient id="shield3d-face" cx="42%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff9d42" />
      <stop offset="25%" stop-color="#ff6a00" />
      <stop offset="65%" stop-color="#c23900" />
      <stop offset="100%" stop-color="#691a00" />
    </radialGradient>

    <!-- Inner Metallic Core Basin (Dark Titanium Recess) -->
    <radialGradient id="shield3d-basin" cx="48%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#241510" />
      <stop offset="50%" stop-color="#150d0a" />
      <stop offset="100%" stop-color="#090503" />
    </radialGradient>

    <!-- 3D Realistic Sphere - Base Ambient Gradient -->
    <radialGradient id="sphere3d-base" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#ffe2b8" />
      <stop offset="42%" stop-color="#ff7e14" />
      <stop offset="78%" stop-color="#b83200" />
      <stop offset="100%" stop-color="#450d00" />
    </radialGradient>

    <!-- 3D Sphere Specular Crescent (Glossy Glass Coating) -->
    <linearGradient id="sphere3d-glaze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- 3D Torus Front Segment Gradient -->
    <linearGradient id="torus3d-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#ffd5a3" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#ff6600" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#b43403" stop-opacity="0.5" />
    </linearGradient>

    <!-- 3D Torus Back Segment Gradient (Occluded Shadow) -->
    <linearGradient id="torus3d-back" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3d1306" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#782405" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.5" />
    </linearGradient>

    <!-- Subtle Ambient Occlusion Shadow for Shield Inset -->
    <linearGradient id="ao-bottom" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65" />
    </linearGradient>
  </defs>

  <!-- ============================================== -->
  <!-- 1. BASE 3D SHIELD PEDESTAL WITH CONTACT SHADOW -->
  <!-- ============================================== -->
  <g filter="url(#shield3d-shadow)">
    <!-- Outer Thick Rim / 3D Extrusion -->
    <path d="M 256 36
             C 366 36 456 94 456 226
             C 456 348 348 438 256 476
             C 164 438 56 348 56 226
             C 56 94 146 36 256 36 Z"
          fill="url(#shield3d-rim)" />

    <!-- 3D Front Facet Plate -->
    <path d="M 256 46
             C 354 46 442 98 442 224
             C 442 338 342 424 256 460
             C 170 424 70 338 70 224
             C 70 98 158 46 256 46 Z"
          fill="url(#shield3d-face)" />

    <!-- 3D Left-Side Key Light Bevel -->
    <path d="M 256 46
             C 158 46 70 98 70 224
             C 70 338 170 424 256 460
             C 246 442 100 334 100 224
             C 100 114 180 64 256 46 Z"
          fill="url(#shield3d-bevel-light)" />

    <!-- 3D Right-Side Shadow Bevel -->
    <path d="M 256 46
             C 354 46 442 98 442 224
             C 442 338 342 424 256 460
             C 270 442 412 334 412 224
             C 412 114 332 64 256 46 Z"
          fill="url(#shield3d-bevel-dark)" />

    <!-- Top Cushion Glaze (3D Soft Rim Highlight) -->
    <path d="M 256 48
             C 340 48 420 92 426 190
             C 400 102 330 64 256 64
             C 182 64 112 102 86 190
             C 92 92 172 48 256 48 Z"
          fill="#ffffff"
          opacity="0.5" />
  </g>

  <!-- ============================================== -->
  <!-- 2. RECESSED TITANIUM CORE CAVITY               -->
  <!-- ============================================== -->
  <g>
    <!-- Recessed Pocket Basin -->
    <path d="M 256 94
             C 334 94 400 140 400 236
             C 400 326 322 392 256 422
             C 190 392 112 326 112 236
             C 112 140 178 94 256 94 Z"
          fill="url(#shield3d-basin)"
          stroke="#ff6a00"
          stroke-width="3.5"
          stroke-opacity="0.45" />

    <!-- Inner Ambient Occlusion Crease -->
    <path d="M 256 96
             C 330 96 394 142 394 236
             C 394 322 320 388 256 418
             C 192 388 118 322 118 236
             C 118 142 182 96 256 96 Z"
          fill="url(#ao-bottom)" />

    <!-- Concentric Cyber Guard Ribs (Depth Layers) -->
    <ellipse cx="256" cy="242" rx="114" ry="114" fill="none" stroke="#ea580c" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="6, 8" />
    <ellipse cx="256" cy="242" rx="92" ry="92" fill="none" stroke="#ea580c" stroke-opacity="0.25" stroke-width="1.5" />
  </g>

  <!-- ============================================== -->
  <!-- 3. 3D ORBITAL TORUS RING (BACK HALF)           -->
  <!-- ============================================== -->
  <!-- Angled orbital ring behind the orb for true 3D depth -->
  <ellipse cx="256" cy="240" rx="124" ry="46"
           fill="none"
           stroke="url(#torus3d-back)"
           stroke-width="12"
           stroke-dasharray="210 220"
           stroke-dashoffset="110"
           transform="rotate(-28 256 240)" />

  <!-- ============================================== -->
  <!-- 4. FLOATING 3D SPHERICAL AI CORE (TRUE 3D ORB) -->
  <!-- ============================================== -->
  <g filter="url(#orb3d-shadow)">
    <!-- Base 3D Sphere -->
    <circle cx="256" cy="238" r="76" fill="url(#sphere3d-base)" />

    <!-- Internal Optical Core / Iris -->
    <circle cx="256" cy="238" r="38" fill="#180b06" stroke="#ff9d42" stroke-width="3" />
    
    <!-- Neon Aperture Glow -->
    <circle cx="256" cy="238" r="22" fill="#ff6a00" filter="url(#core3d-bloom)" />
    <circle cx="256" cy="238" r="10" fill="#ffffff" />

    <!-- Sphere Gloss Top Dome -->
    <path d="M 198 200
             C 214 172 248 166 280 172
             C 304 178 318 194 322 216
             C 308 202 284 196 256 196
             C 228 196 208 202 198 200 Z"
          fill="url(#sphere3d-glaze)" />

    <!-- High-Glint Specular Dot (Light Source Reflection) -->
    <ellipse cx="228" cy="192" rx="14" ry="9" fill="#ffffff" opacity="0.95" transform="rotate(-30 228 192)" />
    <circle cx="248" cy="182" r="4.5" fill="#ffffff" opacity="0.8" />

    <!-- Bottom Rim Bounce Light (Underside Radiance) -->
    <path d="M 212 284
             C 236 304 276 304 300 284
             C 288 296 268 300 256 300
             C 244 300 224 296 212 284 Z"
          fill="#ffd5a3"
          opacity="0.6" />
  </g>

  <!-- ============================================== -->
  <!-- 5. 3D ORBITAL TORUS RING (FRONT HALF)          -->
  <!-- ============================================== -->
  <!-- Angled orbital ring in front of the orb for true 3D overlap -->
  <ellipse cx="256" cy="240" rx="124" ry="46"
           fill="none"
           stroke="url(#torus3d-front)"
           stroke-width="12"
           stroke-linecap="round"
           stroke-dasharray="210 220"
           stroke-dashoffset="-100"
           transform="rotate(-28 256 240)"
           filter="url(#core3d-bloom)" />

  <!-- 3D Specular Star Gleam (Top Crest) -->
  <path d="M 160 110 Q 174 124 160 138 Q 146 124 160 110 Z" fill="#ffffff" opacity="0.9" filter="url(#core3d-bloom)" />
  <circle cx="160" cy="124" r="3" fill="#ffffff" />
</svg>
