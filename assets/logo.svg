<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Soft 3D Lighting & Shadow Filters -->
    <filter id="soft3d-deep-shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#c2410c" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#7c2d12" flood-opacity="0.35" />
    </filter>

    <filter id="soft3d-orb-shadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#431407" flood-opacity="0.5" />
    </filter>

    <filter id="soft3d-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Main Soft 3D Shield Claymorphic Radial Gradient (Top-Left Key Light) -->
    <radialGradient id="soft3d-shield-grad" cx="36%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#ffd5a4" />
      <stop offset="22%" stop-color="#ff9330" />
      <stop offset="55%" stop-color="#ff5c00" />
      <stop offset="85%" stop-color="#c83803" />
      <stop offset="100%" stop-color="#7e1f02" />
    </radialGradient>

    <!-- Inner Shield Cavity Gradient (Dark Cyber Depth) -->
    <radialGradient id="soft3d-cavity-grad" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#2a160d" />
      <stop offset="50%" stop-color="#180e08" />
      <stop offset="100%" stop-color="#0a0503" />
    </radialGradient>

    <!-- 3D Floating Sentinel Orb Radial Gradient -->
    <radialGradient id="soft3d-orb-grad" cx="34%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#ffddb0" />
      <stop offset="48%" stop-color="#ff7b1a" />
      <stop offset="82%" stop-color="#cf3d02" />
      <stop offset="100%" stop-color="#671900" />
    </radialGradient>

    <!-- 3D Torus / Orbit Ring Linear Gradient -->
    <linearGradient id="soft3d-ring-grad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#fed7aa" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#9a3412" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glossy Highlight Curve Gradient -->
    <linearGradient id="soft3d-glaze-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Bottom Bounce Light (Warm Fill) -->
    <linearGradient id="soft3d-bounce-grad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ffaa5e" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffaa5e" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Group with Soft 3D Deep Shadow -->
  <g filter="url(#soft3d-deep-shadow)">
    <!-- 1. Soft 3D Base Shield Body (Pillowy, organic curved guard) -->
    <path d="M 128 22
             C 178 22 222 52 222 120
             C 222 178 168 222 128 238
             C 88 222 34 178 34 120
             C 34 52 78 22 128 22 Z"
          fill="url(#soft3d-shield-grad)" />

    <!-- 2. Bottom Ambient Bounce Rim (Soft 3D underside reflection) -->
    <path d="M 128 22
             C 178 22 222 52 222 120
             C 222 178 168 222 128 238
             C 88 222 34 178 34 120
             C 34 52 78 22 128 22 Z"
          fill="url(#soft3d-bounce-grad)" />

    <!-- 3. Top-Edge Soft Specular Glaze (Claymorphic Cushion Highlight) -->
    <path d="M 128 26
             C 172 26 212 52 214 114
             C 202 62 168 36 128 36
             C 88 36 54 62 42 114
             C 44 52 84 26 128 26 Z"
          fill="url(#soft3d-glaze-grad)" />
  </g>

  <!-- 4. Inner Recessed Core Basin (Depth Layer) -->
  <path d="M 128 46
           C 166 46 198 70 198 122
           C 198 168 158 202 128 216
           C 98 202 58 168 58 122
           C 58 70 90 46 128 46 Z"
        fill="url(#soft3d-cavity-grad)"
        stroke="#ff7714"
        stroke-opacity="0.35"
        stroke-width="2.5" />

  <!-- 5. Recessed Inner Ambient Shading -->
  <path d="M 128 48
           C 164 48 194 72 194 120
           C 194 140 186 160 174 176
           C 188 156 192 134 190 114
           C 186 78 158 56 128 56
           C 98 56 70 78 66 114
           C 64 134 68 156 82 176
           C 70 160 62 140 62 120
           C 62 72 92 48 128 48 Z"
        fill="#000000"
        opacity="0.5" />

  <!-- 6. Floating 3D Sentinel Core Orb (Key Element) -->
  <g filter="url(#soft3d-orb-shadow)">
    <!-- Base 3D Sphere -->
    <circle cx="128" cy="122" r="38" fill="url(#soft3d-orb-grad)" />

    <!-- Sphere Gloss Dome -->
    <ellipse cx="122" cy="104" rx="20" ry="12" fill="url(#soft3d-glaze-grad)" transform="rotate(-15 122 104)" />
    
    <!-- Ultra Sharp Specular Dot -->
    <circle cx="114" cy="100" r="4.5" fill="#ffffff" opacity="0.9" />
    <circle cx="123" cy="95" r="2" fill="#ffffff" opacity="0.75" />
  </g>

  <!-- 7. 3D Floating Torus / Orbital Ring (Encircling the Orb) -->
  <ellipse cx="128" cy="124" rx="58" ry="22"
           fill="none"
           stroke="url(#soft3d-ring-grad)"
           stroke-width="5"
           stroke-linecap="round"
           transform="rotate(-24 128 124)"
           filter="url(#soft3d-glow)" />

  <!-- 8. AI Sensor Pupil / Sentry Eye Center -->
  <circle cx="128" cy="122" r="14" fill="#150a04" stroke="#ffaa5e" stroke-width="1.8" />
  <circle cx="128" cy="122" r="7" fill="#ff7300" filter="url(#soft3d-glow)" />
  <circle cx="128" cy="122" r="3" fill="#ffffff" />

  <!-- 9. Soft 3D Light Glint (Star sparkle on shield crest) -->
  <path d="M 86 58 Q 94 66 86 74 Q 78 66 86 58 Z" fill="#ffffff" opacity="0.85" filter="url(#soft3d-glow)" />
</svg>
