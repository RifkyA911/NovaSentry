<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Diffuse Ground Shadow Filter -->
    <filter id="softbody-ground-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur" />
    </filter>

    <!-- 3D Specular Blur -->
    <filter id="specular-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Master Keylight Gradient (Top Left 45 deg) -->
    <radialGradient id="sb-lobe-main" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#fff2e0" />
      <stop offset="18%" stop-color="#ff9d3b" />
      <stop offset="48%" stop-color="#ff5900" />
      <stop offset="82%" stop-color="#ba2b00" />
      <stop offset="100%" stop-color="#4a0f00" />
    </radialGradient>

    <!-- Secondary Soft Body Lobe (Right Twist) -->
    <radialGradient id="sb-lobe-right" cx="42%" cy="26%" r="70%">
      <stop offset="0%" stop-color="#ffe3c2" />
      <stop offset="22%" stop-color="#ff8924" />
      <stop offset="55%" stop-color="#e84e00" />
      <stop offset="88%" stop-color="#991f00" />
      <stop offset="100%" stop-color="#3d0a00" />
    </radialGradient>

    <!-- Bottom Intertwined Fold (Ambient Occlusion & Warm Bounce) -->
    <radialGradient id="sb-lobe-bottom" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffad5a" />
      <stop offset="35%" stop-color="#ff6000" />
      <stop offset="75%" stop-color="#b82600" />
      <stop offset="100%" stop-color="#400b00" />
    </radialGradient>

    <!-- Deep Crease Cavity (Self-Shadowing) -->
    <linearGradient id="sb-crease-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0500" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#470e00" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0" />
    </linearGradient>

    <!-- Glossy Specular Glaze (Curved High-Gloss Sheen) -->
    <linearGradient id="sb-specular-arc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Subsurface Radiance Accent (Neon Core Inset) -->
    <radialGradient id="sb-cyber-iris" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffaa44" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#1a0400" />
    </radialGradient>
  </defs>

  <!-- ============================================== -->
  <!-- 1. SOFT GROUND CONTACT & AMBIENT SHADOWS       -->
  <!-- ============================================== -->
  <g>
    <!-- Wide Diffuse Ambient Floor Shadow -->
    <ellipse cx="256" cy="442" rx="150" ry="26" fill="#2b0a02" opacity="0.35" filter="url(#softbody-ground-shadow)" />
    <!-- Crisp Tight Contact Shadow -->
    <ellipse cx="256" cy="436" rx="95" ry="14" fill="#140300" opacity="0.55" filter="url(#softbody-ground-shadow)" />
  </g>

  <!-- ============================================== -->
  <!-- 2. REAR INTERTWINED SOFT-BODY FOLD             -->
  <!-- ============================================== -->
  <!-- Back curving lobe that loops behind the main knot -->
  <path d="M 172 178
           C 134 118 200 62 284 76
           C 362 88 412 168 376 254
           C 346 326 264 362 208 328
           C 168 304 184 246 226 232
           C 278 214 316 168 288 126
           C 264 92 204 104 172 178 Z"
        fill="url(#sb-lobe-bottom)" />

  <!-- Shadow cast by front folds onto the rear loop -->
  <path d="M 234 132
           C 280 152 320 200 304 266
           C 288 328 226 344 196 326
           C 234 318 274 278 284 234
           C 294 186 266 148 234 132 Z"
        fill="url(#sb-crease-shadow)" />

  <!-- ============================================== -->
  <!-- 3. LOWER SOFT INFLATED BULB                    -->
  <!-- ============================================== -->
  <path d="M 148 248
           C 112 288 116 358 172 404
           C 230 452 334 446 384 388
           C 432 332 408 262 344 246
           C 284 232 232 278 198 274
           C 174 270 160 258 148 248 Z"
        fill="url(#sb-lobe-bottom)" />

  <!-- Lower Bulb Specular Sheen -->
  <path d="M 186 386
           C 246 430 330 422 368 372
           C 352 396 288 412 226 394
           C 198 386 188 378 186 386 Z"
          fill="#ffbe7b"
          opacity="0.45" />

  <!-- ============================================== -->
  <!-- 4. MAIN CENTRAL INFLATED SOFT-BODY SPHERE LOBE -->
  <!-- ============================================== -->
  <path d="M 216 104
           C 310 72 418 132 416 238
           C 414 334 322 404 224 388
           C 134 374 88 278 112 188
           C 130 122 172 118 216 104 Z"
        fill="url(#sb-lobe-main)" />

  <!-- Crease Shadow Under the Main Sphere Crevice -->
  <path d="M 172 208
           C 214 244 276 258 334 228
           C 292 274 224 286 168 254
           C 142 240 154 218 172 208 Z"
        fill="url(#sb-crease-shadow)" />

  <!-- ============================================== -->
  <!-- 5. TOP ORGANIC BULGE / TWISTING CUSHION CREST  -->
  <!-- ============================================== -->
  <path d="M 184 108
           C 236 82 322 96 356 156
           C 386 210 354 272 296 286
           C 238 300 184 256 166 204
           C 152 162 158 122 184 108 Z"
        fill="url(#sb-lobe-right)" />

  <!-- Deep Occlusion Valley Between the Folds -->
  <path d="M 204 168
           C 236 196 278 206 314 186
           C 284 222 236 226 194 204
           C 178 196 186 180 204 168 Z"
        fill="#260600"
        opacity="0.75" />

  <!-- ============================================== -->
  <!-- 6. NOVASENTRY INTEGRATED CYBER IRIS CORE       -->
  <!-- ============================================== -->
  <!-- Peeking from the center of the soft-body folds -->
  <g transform="translate(242, 212)">
    <circle cx="18" cy="18" r="32" fill="#140400" />
    <circle cx="18" cy="18" r="26" fill="url(#sb-cyber-iris)" />
    <circle cx="18" cy="18" r="14" fill="#0d0200" stroke="#ff8c2b" stroke-width="2.5" />
    <circle cx="18" cy="18" r="6" fill="#ffffff" filter="url(#specular-soft)" />
  </g>

  <!-- ============================================== -->
  <!-- 7. ULTRA-GLOSSY SOFT-BODY SPECULAR HIGHLIGHTS  -->
  <!-- ============================================== -->
  <!-- Primary High-Gloss Crescent (Top Left Keylight Reflection) -->
  <path d="M 174 136
           C 208 108 268 108 308 126
           C 328 136 344 154 350 174
           C 342 152 318 134 290 124
           C 252 110 200 114 168 138
           C 162 142 168 138 174 136 Z"
        fill="url(#sb-specular-arc)"
        filter="url(#specular-soft)" />

  <!-- Glossy Specular Hotspot Dot -->
  <ellipse cx="218" cy="134" rx="22" ry="12" fill="#ffffff" opacity="0.92" transform="rotate(-25 218 134)" filter="url(#specular-soft)" />
  <ellipse cx="236" cy="126" rx="8" ry="4.5" fill="#ffffff" opacity="0.98" transform="rotate(-25 236 126)" />

  <!-- Secondary Soft Cushion Highlight (Top-Right Bulb) -->
  <path d="M 324 168
           C 348 188 360 218 356 248
           C 358 226 348 202 332 184
           C 320 170 310 162 324 168 Z"
        fill="#ffffff"
        opacity="0.6"
        filter="url(#specular-soft)" />

  <!-- Underside Warm Ambient Bounce Glow (Juicy Tangerine Radiance) -->
  <path d="M 176 348
           C 214 382 284 384 326 352
           C 300 372 248 376 206 358
           C 188 350 178 344 176 348 Z"
        fill="#ffd1a3"
        opacity="0.75" />
</svg>
