<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Carrot Orange to Amber Gradients -->
    <linearGradient id="carrotGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7849" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="amberAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>

    <linearGradient id="darkShieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b18" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>

    <filter id="neonCarrot" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Shield -->
  <circle cx="100" cy="100" r="75" fill="#f97316" opacity="0.15" filter="url(#neonCarrot)" />

  <!-- Outer Cyber Hex Shield -->
  <path d="M 100 18 L 165 48 L 165 110 C 165 152 100 182 100 182 C 100 182 35 152 35 110 L 35 48 Z" 
        fill="url(#darkShieldBg)" 
        stroke="url(#carrotGlow)" 
        stroke-width="3.5" 
        stroke-linejoin="round" />

  <!-- Inner Angular Shield Accent -->
  <path d="M 100 32 L 150 56 L 150 106 C 150 138 100 164 100 164 C 100 164 50 138 50 106 L 50 56 Z" 
        fill="none" 
        stroke="url(#amberAccent)" 
        stroke-width="1.8" 
        stroke-opacity="0.45" 
        stroke-dasharray="4, 3" />

  <!-- Central Sentinel AI Core (Nova Spark & Eye) -->
  <!-- Top Node -->
  <circle cx="100" cy="58" r="4.5" fill="#ffedd5" />
  <line x1="100" y1="63" x2="100" y2="82" stroke="url(#carrotGlow)" stroke-width="2.5" />

  <!-- Left & Right Circuit Wings -->
  <line x1="100" y1="85" x2="70" y2="100" stroke="url(#carrotGlow)" stroke-width="2.5" />
  <line x1="100" y1="85" x2="130" y2="100" stroke="url(#carrotGlow)" stroke-width="2.5" />
  <circle cx="70" cy="100" r="4" fill="#fb923c" />
  <circle cx="130" cy="100" r="4" fill="#fb923c" />

  <line x1="70" y1="104" x2="82" y2="128" stroke="url(#carrotGlow)" stroke-width="2" />
  <line x1="130" y1="104" x2="118" y2="128" stroke="url(#carrotGlow)" stroke-width="2" />
  <circle cx="82" cy="128" r="3.5" fill="#ea580c" />
  <circle cx="118" cy="128" r="3.5" fill="#ea580c" />

  <!-- Hexagonal Core Diamond -->
  <polygon points="100,75 118,92 118,114 100,126 82,114 82,92" 
           fill="url(#carrotGlow)" 
           filter="url(#neonCarrot)"
           opacity="0.9" />

  <!-- Inner Core Pupil -->
  <polygon points="100,83 110,95 110,110 100,118 90,110 90,95" 
           fill="#ffffff" />
  
  <circle cx="100" cy="102" r="3.5" fill="#ea580c" />

  <!-- Lower Vector Anchor -->
  <line x1="100" y1="126" x2="100" y2="152" stroke="url(#amberAccent)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="100" cy="153" r="4" fill="#ff7849" />
</svg>
